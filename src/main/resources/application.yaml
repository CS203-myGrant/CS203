spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: policy-impact

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:./app/

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/policy_impact}
    username: ${DATABASE_USERNAME:policy_user}
    password: ${DATABASE_PASSWORD:policy_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # CS203-174: timeouts for every client built from the shared RestClient.Builder: OpenAI
  # embeddings through Spring AI, and the Federal Register, Visa Bulletin and USCIS imports.
  # OpenAI chat and the Anthropic judge override the read timeout (mygrant.ai.http below).
  # The JDK client is named so a new dependency cannot silently switch the HTTP client.
  http:
    client:
      factory: jdk
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:30s}

  ai:
    # Spring AI is used only for embeddings. Chat goes through OpenAiGenerationService,
    # so every other OpenAI model the starter offers is switched off.
    model:
      embedding: openai
      chat: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      # The starter refuses to start without a key, so tests and CI that never embed
      # anything get a placeholder; a real call with it fails with HTTP 401.
      api-key: ${OPENAI_API_KEY:not-configured}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          # Matches the pgvector column below, so switching from the old 1024-dimension
          # Ollama model needed no schema change. Change both together.
          dimensions: 1024
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        schema-name: public
        table-name: policy_chunks
        schema-validation: false

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:${APP_BASE_URL:http://localhost:8080},http://localhost:*,http://127.0.0.1:*}"

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-6.1-sol}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  judge-model: ${ANTHROPIC_JUDGE_MODEL:claude-haiku-5-5}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}

mygrant:
  # CS203-174: OpenAI chat and the Anthropic judge. A chat completion answers only once it has
  # finished generating, so its read timeout is longer than other clients'. Only timeouts and
  # other I/O failures, 429 and 5xx are retried; a Retry-After over max-retry-after fails at once.
  # The same retry rule replaces Spring AI's for embeddings, so spring.ai.retry.* is not used.
  ai:
    http:
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_HTTP_READ_TIMEOUT:90s}
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      initial-backoff: ${AI_RETRY_INITIAL_BACKOFF:1s}
      multiplier: ${AI_RETRY_MULTIPLIER:2.0}
      max-backoff: ${AI_RETRY_MAX_BACKOFF:8s}
      max-retry-after: ${AI_RETRY_MAX_RETRY_AFTER:20s}
  # CS203-12, CS203-176: per-user caps on requests that call the AI services, each with its own
  # allowance. Over a cap the API answers 429 with a Retry-After header. Counts are in memory,
  # so each instance limits on its own.
  rate-limits:
    # Policy follow-up questions and /rag/query combined.
    questions:
      enabled: ${QUESTION_RATE_LIMIT_ENABLED:true}
      max-requests: ${QUESTION_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${QUESTION_RATE_LIMIT_WINDOW:1m}
    # Opening a policy's assessment (POST /policies/{id}/recommendation), stored or not.
    recommendations:
      enabled: ${RECOMMENDATION_RATE_LIMIT_ENABLED:true}
      max-requests: ${RECOMMENDATION_RATE_LIMIT_MAX_REQUESTS:30}
      window: ${RECOMMENDATION_RATE_LIMIT_WINDOW:1m}
    # Admin re-evaluation (POST /evaluate).
    evaluations:
      enabled: ${EVALUATION_RATE_LIMIT_ENABLED:true}
      max-requests: ${EVALUATION_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${EVALUATION_RATE_LIMIT_WINDOW:1m}
  # CS203-175: a policy source is stale (and the app warns users) when it has not synced
  # successfully within its poll interval times this factor, or has never synced.
  sources:
    stale-grace-factor: ${SOURCE_STALE_GRACE_FACTOR:3}
  impact:
    assessments-enabled: ${IMPACT_ASSESSMENTS_ENABLED:true}
    review-confidence-threshold: ${IMPACT_REVIEW_CONFIDENCE_THRESHOLD:60}
  demo:
    enabled: ${MYGRANT_DEMO_ENABLED:false}
    evaluate: ${MYGRANT_DEMO_EVALUATE:false}
    applicant-password: ${DEMO_APPLICANT_PASSWORD:}
    manager-password: ${DEMO_MANAGER_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    report-directory: ${MYGRANT_DEMO_REPORT_DIRECTORY:demo-reports}
  # TEMPORARY testing aid: lets admins and applicants move the app's "today" to when a
  # policy is published, from the admin page and profile settings. Set to false to hide it.
  test-clock:
    enabled: ${TEST_CLOCK_ENABLED:true}
  rules:
    # CS203-86: link documents stored before policy rules existed, in the background after startup.
    # Idempotent; a failure is logged and the application keeps running.
    backfill-on-startup: ${RULES_BACKFILL_ON_STARTUP:true}
  email:
    app-base-url: ${APP_BASE_URL:http://localhost:8080}
    # Local demos only: also email password-registered accounts, whose address is unverified.
    allow-unverified-recipients: ${EMAIL_ALLOW_UNVERIFIED_RECIPIENTS:false}
    # Set to false to run no email jobs at all. Sending also needs RESEND_API_KEY and RESEND_FROM_EMAIL.
    jobs-enabled: ${EMAIL_JOBS_ENABLED:true}
    dispatch-interval: ${EMAIL_DISPATCH_INTERVAL:30s}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:4}
    retry-backoff: ${EMAIL_RETRY_BACKOFF:1m,5m,15m}
    immediate-lookback: ${EMAIL_IMMEDIATE_LOOKBACK:24h}
    stuck-after: ${EMAIL_STUCK_AFTER:10m}
    batch-size: ${EMAIL_BATCH_SIZE:50}
    # Spring cron (second minute hour day month weekday), run in digest-zone.
    digest-cron: ${EMAIL_DIGEST_CRON:0 0 8 * * *}
    digest-zone: ${EMAIL_DIGEST_ZONE:America/New_York}
    digest-lookback: ${EMAIL_DIGEST_LOOKBACK:48h}

springdoc:
  # Every JSON endpoint is documented as application/json rather than */*.
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    # Within each feature section, list operations alphabetically by path.
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${PORT:8080}
  error:
    include-message: never
