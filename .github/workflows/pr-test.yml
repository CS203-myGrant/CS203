name: PR build and test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: policy_impact
          POSTGRES_USER: policy_user
          POSTGRES_PASSWORD: policy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy_user -d policy_impact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/policy_impact
      DATABASE_USERNAME: policy_user
      DATABASE_PASSWORD: policy_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # CI tests mock provider clients. A closed local address makes any accidental live call
      # fail immediately instead of reaching OpenAI or Anthropic.
      OPENAI_API_KEY: ci-not-configured
      OPENAI_BASE_URL: http://127.0.0.1:9
      ANTHROPIC_API_KEY: ci-not-configured
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
      RESEND_API_KEY: ""
      WORKOS_API_KEY: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Fails fast if the OpenAPI document is invalid, has a path outside /api/v1, is
      # missing docs, or claims auth rules that differ from SecurityConfig. Run again below.
      - name: Check API contract
        run: ./mvnw test -Dtest=OpenApiContractTest

      - name: Run tests and generate coverage report
        # verify runs the Testcontainers pgvector flow, the permission matrix, and JaCoCo.
        run: ./mvnw verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Set up Node for dashboard tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dashboard tests
        run: node --test src/test/js/*.test.cjs

      - name: Build Docker image
        run: docker build --tag policy-impact:pr .
