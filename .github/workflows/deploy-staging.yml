name: Build and deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish commit-tagged image
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use
          docker buildx build --platform linux/amd64 --tag "$image_name:${GITHUB_SHA}" --push .
      - name: Trigger Render staging deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          response=$(curl --fail --silent --show-error \
            --request POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg imageUrl "$image_name:${GITHUB_SHA}" '{imageUrl: $imageUrl}')")
          deploy_id=$(jq -er '.id' <<< "$response")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: bash .github/scripts/wait-for-render-deploy.sh
      - name: Run authenticated staging smoke checks
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: bash .github/scripts/deployment-smoke.sh
